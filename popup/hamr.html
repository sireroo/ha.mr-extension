<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="utf-8" />
    <style>

:root {
  color-scheme: light dark;
}

* {
  margin: 0;
}

    .hidden {
      display: none;
    }

    html, body {
      width: 200px;
      height: 293px;
      overflow: hidden;
    }

    #qrcode {
      width: 100vw;
      height: 100vw;
      image-rendering: pixelated;
    }

    #main {
      gap: 0;
      display: flex;
      flex-direction: column;
    }

    #buttons {
      width: 100vw;
      height: 17.0vh;
      display: flex;
      border-top: 2px solid ButtonBorder;
    }

    #morebuttons {
      width: 100vw;
      height: 14.0vh;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 0.5em;
      border-top: 1px solid ButtonBorder;
    }

    .button-holder {
      height: 100%;
      width: 50%;
      box-sizing: border-box;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 0.5em;
    }

    button {
      height: 2.3em;
      width: 2.3em;
      display: flex;
      justify-content: center;
      align-items: center;
      animation: flash 0.5s ease-out;
      border: solid 1px ButtonBorder;
      border-radius: 5px;
      box-shadow: none;
    }

    .small-button {
      height: 2em;
      width: 2em;
      display: flex;
      justify-content: center;
      align-items: center;
      animation: flash 0.5s ease-out;
      border: solid 1px ButtonBorder;
      border-radius: 5px;
      box-shadow: none;
    }

    @keyframes flash {
      0%, 100% {
        background-color: ButtonFace;
      }
      50% {
        background-color: light-dark(limegreen, green);
      }
    }

    </style>
  </head>

  <body>
    <div id="main">
      <img alt="a qr code" id="qrcode" ></img>
      <div id="buttons">
        <div class="button-holder" >
          <button title="Copy ha.mr link" id="urlbtn">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icons-tabler-outline icon-tabler-link"> <path stroke="none" d="M0 0h24v24H0z" fill="none" /> <path d="M9 15l6 -6" /> <path d="M11 6l.463 -.536a5 5 0 0 1 7.071 7.072l-.534 .464" /> <path d="M13 18l-.397 .534a5.068 5.068 0 0 1 -7.127 0a4.972 4.972 0 0 1 0 -7.071l.524 -.463" /> </svg>
          </button>
          <button title="Copy emoji ha.mr link" id="emjbtn">

          </button>
        </div>
        <div class="button-holder" >
          <button title="Copy QR code" id="qrbtn">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icons-tabler-outline icon-tabler-qrcode"> <path stroke="none" d="M0 0h24v24H0z" fill="none" /> <path d="M4 5a1 1 0 0 1 1 -1h4a1 1 0 0 1 1 1v4a1 1 0 0 1 -1 1h-4a1 1 0 0 1 -1 -1l0 -4" /> <path d="M7 17l0 .01" /> <path d="M14 5a1 1 0 0 1 1 -1h4a1 1 0 0 1 1 1v4a1 1 0 0 1 -1 1h-4a1 1 0 0 1 -1 -1l0 -4" /> <path d="M7 7l0 .01" /> <path d="M4 15a1 1 0 0 1 1 -1h4a1 1 0 0 1 1 1v4a1 1 0 0 1 -1 1h-4a1 1 0 0 1 -1 -1l0 -4" /> <path d="M17 7l0 .01" /> <path d="M14 14l3 0" /> <path d="M20 14l0 .01" /> <path d="M14 14l0 3" /> <path d="M14 20l3 0" /> <path [118;1:3ud="M17 17l3 0" /> <path d="M20 17l0 3" /> </svg>
          </button>
          <a id="svelink" download="hamr-qrcode.png">
            <button title="Save QR code" id="svebtn">
              <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icons-tabler-outline icon-tabler-download"> <path stroke="none" d="M0 0h24v24H0z" fill="none" /> <path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2 -2v-2" /> <path d="M7 11l5 5l5 -5" /> <path d="M12 4l0 12" /> </svg>
            </button>
          </a>
        </div>
      </div>
      <div id="morebuttons">
        <button title="Switch to normal link mode" id="swpbtn" class="small-button">
          <svg id="hamricon" class="hidden" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icons-tabler-outline icon-tabler-hammer"><path stroke="none" d="M0 0h24v24H0z" fill="none" /><path d="M11.414 10l-7.383 7.418a2.091 2.091 0 0 0 0 2.967a2.11 2.11 0 0 0 2.976 0l7.407 -7.385" /><path d="M18.121 15.293l2.586 -2.586a1 1 0 0 0 0 -1.414l-7.586 -7.586a1 1 0 0 0 -1.414 0l-2.586 2.586a1 1 0 0 0 0 1.414l7.586 7.586a1 1 0 0 0 1.414 0" /></svg>
          <svg id="linkicon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icons-tabler-outline icon-tabler-link-plus"><path stroke="none" d="M0 0h24v24H0z" fill="none" /><path d="M9 15l6 -6" /><path d="M11 6l.463 -.536a5 5 0 0 1 7.072 0a4.993 4.993 0 0 1 -.001 7.072" /><path d="M12.603 18.534a5.07 5.07 0 0 1 -7.127 0a4.972 4.972 0 0 1 0 -7.071l.524 -.463" /><path d="M16 19h6" /><path d="M19 16v6" /></svg>
        </button>
        <button title="Settings" id="stngbtn" class="small-button">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icons-tabler-outline icon-tabler-settings"><path stroke="none" d="M0 0h24v24H0z" fill="none" /><path d="M10.325 4.317c.426 -1.756 2.924 -1.756 3.35 0a1.724 1.724 0 0 0 2.573 1.066c1.543 -.94 3.31 .826 2.37 2.37a1.724 1.724 0 0 0 1.065 2.572c1.756 .426 1.756 2.924 0 3.35a1.724 1.724 0 0 0 -1.066 2.573c.94 1.543 -.826 3.31 -2.37 2.37a1.724 1.724 0 0 0 -2.572 1.065c-.426 1.756 -2.924 1.756 -3.35 0a1.724 1.724 0 0 0 -2.573 -1.066c-1.543 .94 -3.31 -.826 -2.37 -2.37a1.724 1.724 0 0 0 -1.065 -2.572c-1.756 -.426 -1.756 -2.924 0 -3.35a1.724 1.724 0 0 0 1.066 -2.573c-.94 -1.543 .826 -3.31 2.37 -2.37c1 .608 2.296 .07 2.572 -1.065" /><path d="M9 12a3 3 0 1 0 6 0a3 3 0 0 0 -6 0" /></svg>
        </button>
      </div>
    </div>
    <script type="module" src="hamr.js"></script>
  </body>
</html>
