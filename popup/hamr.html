<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="utf-8" />
	<style>
    @import url('https://fonts.googleapis.com/css2?family=Hammersmith+One&display=swap');

    :root {
      color-scheme: light dark;
    }

		html, body {
			margin: 0;
			width: 150px;
      height: 200px;
      overflow: hidden;
		}

    * {
      font-family: "Hammersmith One", sans-serif;
      margin: 0;
    }

    #qrcode {
      width: 100vw;
      height: 100vw;
      image-rendering: pixelated;
      margin: 0;
    }

    #main {
      gap: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
    }

    #buttons {
      width: 100vw;
      height: 100%;
      margin: 0;
      padding: 0;
    }

    #link-buttons {
      margin: 0;
      height: 100%;
      width: 33%;
      border: 2px solid blue;
    }

    #qr-buttons {
      margin: 0;
      height: 100%;
      width: 66%;
      border: 2px solid red;
      float: right;
    }
	</style>
</head>

  <body>
    <div id="main">
      <canvas id="qrcode"></canvas>
      <div id="buttons">
        <div id="link-buttons">
        </div>
        <div id="qr-buttons">
        </div>
      </div>
    </div>
    <script type="module" src="hamr.js"></script>
  </body>
</html>
